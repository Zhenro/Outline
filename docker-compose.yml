services:
  outline:
    image: docker.getoutline.com/outlinewiki/outline:latest # Recomendado fijar versión, ej: outlinewiki/outline:0.72.0
    env_file: ./docker.env
    ports:
      - "3000:3000"
    volumes:
      - storage-data:/var/lib/outline/data
    depends_on:
      - postgres
      - redis
    restart: always

  redis:
    image: redis:7-alpine
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 30s
      retries: 3
    restart: always

  postgres:
    image: postgres:15-alpine
    env_file: ./docker.env
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-d", "outline", "-U", "user" ]
      interval: 30s
      timeout: 20s
      retries: 3
    environment:
      POSTGRES_USER: 'user'
      POSTGRES_PASSWORD: 'pass_seguro_db' # Debe coincidir con DATABASE_URL
      POSTGRES_DB: 'outline'
    restart: always

volumes:
  storage-data:
  database-data:
